plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.1.0"
	id "org.jetbrains.kotlin.plugin.serialization" version "2.1.0"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.mod_name

repositories {
	mavenLocal()
	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.wispforest.io" }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/cde.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional CDBE dependency
    	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Serialization
	implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

	// Cobblemon
	modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}"

	// Database
	implementation "org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"
	include "org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"
	implementation "com.zaxxer:HikariCP:${project.hikaricp_version}"
	include "com.zaxxer:HikariCP:${project.hikaricp_version}"
	implementation "org.xerial:sqlite-jdbc:${project.sqlite_version}"
	include "org.xerial:sqlite-jdbc:${project.sqlite_version}"
	// owo-lib
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	include "io.wispforest:owo-lib:${project.owo_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}

